<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Institutional digital publishing flow</title><desc id="desc">Diagram showing structured academic and public information flowing through timetable and calendar sources into GitHub-managed generation and public web outputs.</desc>
<rect width="1200" height="720" fill="#080b0f"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#e8edf2"><text x="64" y="72" font-size="30" font-weight="700">Institutional Digital Operations · Publishing Flow</text><text x="64" y="105" font-size="15" fill="#8794a3">Live system + public repositories</text></g>
<g stroke="#33404d" stroke-width="2" fill="#0d141b">
<rect x="70" y="215" width="210" height="120" rx="14"/><rect x="70" y="385" width="210" height="120" rx="14"/><rect x="370" y="255" width="220" height="210" rx="14"/><rect x="680" y="215" width="210" height="120" rx="14"/><rect x="680" y="385" width="210" height="120" rx="14"/><rect x="980" y="300" width="150" height="120" rx="14"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="175" y="260" font-size="18" fill="#72b8ff" font-weight="700">FET XML</text><text x="175" y="290" font-size="13" fill="#8794a3">timetable source</text><text x="175" y="430" font-size="18" fill="#72b8ff" font-weight="700">Calendar / content</text><text x="175" y="460" font-size="13" fill="#8794a3">scheduled public data</text><text x="480" y="305" font-size="20" fill="#baff67" font-weight="700">GitHub-managed workflow</text><text x="480" y="342" font-size="14" fill="#8794a3">versioned source</text><text x="480" y="369" font-size="14" fill="#8794a3">scheduled generation</text><text x="480" y="396" font-size="14" fill="#8794a3">reviewable deployment</text><text x="785" y="260" font-size="18" fill="#e8edf2" font-weight="700">Generated timetable</text><text x="785" y="290" font-size="13" fill="#8794a3">class · teacher · room views</text><text x="785" y="430" font-size="18" fill="#e8edf2" font-weight="700">Institutional website</text><text x="785" y="460" font-size="13" fill="#8794a3">public information + updates</text><text x="1055" y="345" font-size="18" fill="#ffbd66" font-weight="700">Visitors</text><text x="1055" y="375" font-size="13" fill="#8794a3">staff · parents · public</text></g>
<g stroke="#baff67" stroke-width="3" fill="none"><path d="M280 275 H370"/><path d="M280 445 H370"/><path d="M590 320 H680"/><path d="M590 400 H680"/><path d="M890 275 C940 275 940 340 980 340"/><path d="M890 445 C940 445 940 380 980 380"/></g>
<g fill="#baff67"><path d="M360 268 l12 7 -12 7z"/><path d="M360 438 l12 7 -12 7z"/><path d="M670 313 l12 7 -12 7z"/><path d="M670 393 l12 7 -12 7z"/><path d="M970 333 l12 7 -12 7z"/><path d="M970 373 l12 7 -12 7z"/></g>
<text x="64" y="650" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#6f7c89">The value is repeatable institutional publishing, not merely a website. Public outputs remain separated from private operational data.</text>
</svg>
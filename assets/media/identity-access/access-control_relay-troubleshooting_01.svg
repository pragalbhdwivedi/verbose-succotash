<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Access control fail-safe relay troubleshooting diagram</title>
  <desc id="desc">Generic privacy-safe schematic showing a face terminal relay using COM and NC for a fail-safe electromagnetic lock, plus a no-touch exit button connected to BTN and ground.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07090c"/><stop offset="1" stop-color="#10131a"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#232831" stroke-width="1" opacity=".35"/></pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#87939d"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/>
  <text x="64" y="72" fill="#ffbd66" font-family="ui-monospace, monospace" font-size="15" letter-spacing="3">SOURCE-BACKED · FIELD TROUBLESHOOTING</text>
  <text x="64" y="116" fill="#f2f5f7" font-family="Arial" font-size="34" font-weight="700">Fail-Safe Access-Control Relay Logic</text>
  <text x="64" y="149" fill="#91a0ab" font-family="Arial" font-size="16">Generic schematic derived from Hikvision terminal + no-touch exit + electromagnetic-lock troubleshooting</text>

  <!-- lock PSU -->
  <g transform="translate(70 242)">
    <rect width="180" height="154" rx="14" fill="#11171d" stroke="#ffbd66"/>
    <text x="90" y="34" text-anchor="middle" fill="#ffbd66" font-family="ui-monospace, monospace" font-size="12">LOCK POWER</text>
    <rect x="31" y="58" width="118" height="54" rx="8" fill="#20180f" stroke="#805a27"/>
    <text x="90" y="82" text-anchor="middle" fill="#ffdfa7" font-family="Arial" font-size="13" font-weight="700">12V DC PSU</text>
    <text x="90" y="101" text-anchor="middle" fill="#b89a71" font-family="Arial" font-size="11">separate lock supply</text>
    <text x="90" y="137" text-anchor="middle" fill="#776956" font-family="Arial" font-size="10">power source, not control logic</text>
  </g>

  <path d="M250 300H352" stroke="#d49d4f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="301" y="286" text-anchor="middle" fill="#b89564" font-family="ui-monospace, monospace" font-size="10">+12V TO COM</text>

  <!-- terminal -->
  <g transform="translate(360 204)">
    <rect width="260" height="230" rx="16" fill="#11171d" stroke="#93a5b7"/>
    <text x="130" y="36" text-anchor="middle" fill="#e7ecef" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">ACCESS TERMINAL</text>
    <rect x="28" y="58" width="204" height="74" rx="9" fill="#111f28" stroke="#4c687a"/>
    <text x="45" y="82" fill="#a9b7c0" font-family="Arial" font-size="12">Relay</text>
    <circle cx="105" cy="96" r="17" fill="#171d22" stroke="#ffbd66"/><text x="105" y="100" text-anchor="middle" fill="#ffbd66" font-family="Arial" font-size="11" font-weight="700">COM</text>
    <circle cx="165" cy="96" r="17" fill="#171d22" stroke="#baff67"/><text x="165" y="100" text-anchor="middle" fill="#baff67" font-family="Arial" font-size="11" font-weight="700">NC</text>
    <circle cx="213" cy="96" r="14" fill="#171d22" stroke="#515b63"/><text x="213" y="100" text-anchor="middle" fill="#71808b" font-family="Arial" font-size="10">NO</text>
    <rect x="28" y="151" width="204" height="48" rx="9" fill="#151526" stroke="#665a91"/>
    <text x="48" y="180" fill="#c3b9df" font-family="Arial" font-size="12">Exit input:</text>
    <text x="122" y="180" fill="#b896ff" font-family="Arial" font-size="12" font-weight="700">BTN + GND</text>
    <text x="130" y="220" text-anchor="middle" fill="#71808b" font-family="Arial" font-size="10">relay opens to release fail-safe lock</text>
  </g>

  <path d="M525 300H742" stroke="#8bb95c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="633" y="286" text-anchor="middle" fill="#a9cc80" font-family="ui-monospace, monospace" font-size="10">NC → LOCK +</text>

  <!-- lock -->
  <g transform="translate(750 242)">
    <rect width="190" height="154" rx="14" fill="#11171d" stroke="#baff67"/>
    <text x="95" y="34" text-anchor="middle" fill="#baff67" font-family="ui-monospace, monospace" font-size="12">EM LOCK</text>
    <rect x="32" y="60" width="126" height="46" rx="7" fill="#172019" stroke="#638a3f"/>
    <text x="95" y="88" text-anchor="middle" fill="#e6f2da" font-family="Arial" font-size="13" font-weight="700">FAIL-SAFE</text>
    <text x="95" y="128" text-anchor="middle" fill="#799066" font-family="Arial" font-size="10">powered = locked</text>
    <text x="95" y="143" text-anchor="middle" fill="#799066" font-family="Arial" font-size="10">power removed = released</text>
  </g>

  <!-- return -->
  <path d="M845 396V452H160V396" fill="none" stroke="#66717a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <text x="505" y="474" text-anchor="middle" fill="#77838c" font-family="ui-monospace, monospace" font-size="10">LOCK − RETURNS TO PSU GROUND</text>

  <!-- exit -->
  <g transform="translate(970 224)">
    <rect width="164" height="186" rx="14" fill="#11171d" stroke="#b896ff"/>
    <text x="82" y="34" text-anchor="middle" fill="#b896ff" font-family="ui-monospace, monospace" font-size="12">NO-TOUCH EXIT</text>
    <circle cx="82" cy="87" r="34" fill="#19172a" stroke="#6d5e9d"/>
    <path d="M61 89c12-18 31-18 42 0M69 97c8-10 19-10 27 0" fill="none" stroke="#d7cff0" stroke-width="3" stroke-linecap="round"/>
    <text x="82" y="142" text-anchor="middle" fill="#c8c0df" font-family="Arial" font-size="11">COM → GND</text>
    <text x="82" y="160" text-anchor="middle" fill="#c8c0df" font-family="Arial" font-size="11">NO → BTN</text>
  </g>
  <path d="M970 330H625" stroke="#8e7bc3" stroke-width="2" marker-end="url(#arr)"/>
  <text x="800" y="318" text-anchor="middle" fill="#a89bd1" font-family="ui-monospace, monospace" font-size="10">EXIT REQUEST INPUT</text>

  <!-- operation -->
  <g transform="translate(66 512)">
    <rect width="1068" height="92" rx="13" fill="#0d1218" stroke="#303b44"/>
    <text x="22" y="28" fill="#ffbd66" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">FAULT-ISOLATION PRINCIPLE</text>
    <text x="22" y="53" fill="#b8c2c9" font-family="Arial" font-size="12">Normal locked state: COM–NC closed → lock receives power. Access granted / exit request: relay opens COM–NC → lock power is interrupted → door releases.</text>
    <text x="22" y="75" fill="#78858e" font-family="Arial" font-size="11">If behaviour is reversed, verify fail-safe/fail-secure expectation, relay terminal selection and exit-input wiring before changing timing/software.</text>
  </g>

  <text x="64" y="638" fill="#71808b" font-family="ui-monospace, monospace" font-size="10">Privacy-safe learning schematic · no site-specific door layout, location or security topology disclosed</text>
  <text x="1136" y="638" text-anchor="end" fill="#ffbd66" font-family="ui-monospace, monospace" font-size="10">PRAGALBH.IN / FIELD EVIDENCE</text>
</svg>
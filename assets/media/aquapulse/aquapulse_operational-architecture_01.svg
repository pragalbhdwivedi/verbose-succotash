<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="420" y="525" font-size="17" fill="#e8edf2" font-weight="700">RBAC</text><text x="420" y="553" font-size="13" fill="#8794a3">roles · permission boundaries</text><text x="695" y="525" font-size="17" fill="#e8edf2" font-weight="700">Audit + review</text><text x="695" y="553" font-size="13" fill="#8794a3">traceable actions</text><text x="970" y="525" font-size="17" fill="#ffbd66" font-weight="700">AI assist</text><text x="970" y="553" font-size="13" fill="#8794a3">explain · summarise · draft</text></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">AquaPulse operational architecture</title><desc id="desc">Privacy-safe diagram showing operators, Next.js interface, NestJS services, PostgreSQL system of record, audit controls and assistive AI.</desc>
<rect width="1200" height="720" fill="#080b0f"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#e8edf2"><text x="64" y="72" font-size="30" font-weight="700">AquaPulse · Operational Architecture</text><text x="64" y="105" font-size="15" fill="#8794a3">Public-repository derivative · active prototype / internal-beta foundation</text></g>
<g stroke="#33404d" stroke-width="2" fill="#0d141b">
<rect x="70" y="250" width="180" height="110" rx="14"/><rect x="315" y="220" width="210" height="170" rx="14"/><rect x="590" y="220" width="210" height="170" rx="14"/><rect x="865" y="220" width="210" height="170" rx="14"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="160" y="294" font-size="20" fill="#e8edf2" font-weight="700">Operators</text><text x="160" y="324" font-size="14" fill="#8794a3">ponds · tasks · alerts</text><text x="420" y="270" font-size="20" fill="#baff67" font-weight="700">Next.js</text><text x="420" y="302" font-size="14" fill="#8794a3">workflow interface</text><text x="420" y="327" font-size="14" fill="#8794a3">role-aware views</text><text x="695" y="270" font-size="20" fill="#baff67" font-weight="700">NestJS</text><text x="695" y="302" font-size="14" fill="#8794a3">business services</text><text x="695" y="327" font-size="14" fill="#8794a3">alerts · approvals</text><text x="970" y="270" font-size="20" fill="#e8edf2" font-weight="700">PostgreSQL</text><text x="970" y="302" font-size="14" fill="#8794a3">durable system of record</text><text x="970" y="327" font-size="14" fill="#8794a3">staged cutover</text></g>
<g stroke="#baff67" stroke-width="3" fill="none"><path d="M250 305 H315"/><path d="M525 305 H590"/><path d="M800 305 H865"/></g><g fill="#baff67"><path d="M305 298 l12 7 -12 7z"/><path d="M580 298 l12 7 -12 7z"/><path d="M855 298 l12 7 -12 7z"/></g>

    <text x="20" y="62" fill="#e8e1f3" font-family="Arial" font-size="13" font-weight="700">Written / leadership task</text>
    <text x="20" y="85" fill="#aaa0b8" font-family="Arial" font-size="11">subject knowledge or</text>
    <text x="20" y="103" fill="#aaa0b8" font-family="Arial" font-size="11">decision-making depth</text>
  </g>
  <path d="M770 283H825" stroke="#728392" stroke-width="2" marker-end="url(#arrow)"/>


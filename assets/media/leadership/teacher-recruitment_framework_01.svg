    <text x="20" y="62" fill="#e1e8ed" font-family="Arial" font-size="13" font-weight="700">Application review</text>
    <text x="20" y="85" fill="#9facb5" font-family="Arial" font-size="11">experience · subject depth</text>
    <text x="20" y="103" fill="#9facb5" font-family="Arial" font-size="11">role-fit requirements</text>
  </g>
  <path d="M515 283H570" stroke="#728392" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(580 220)">

    <text x="20" y="62" fill="#e1e8ed" font-family="Arial" font-size="13" font-weight="700">Expectations made explicit</text>
    <text x="20" y="85" fill="#9facb5" font-family="Arial" font-size="11">teaching / leadership quality</text>
    <text x="20" y="103" fill="#9facb5" font-family="Arial" font-size="11">documentation · teamwork</text>
  </g>
  <path d="M325 475H270" stroke="#728392" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(70 412)">
    <rect width="190" height="126" rx="14" fill="#0e1821" stroke="#72b8ff"/>
    <text x="20" y="32" fill="#72b8ff" font-family="ui-monospace, monospace" font-size="11">08 · REVIEW LOOP</text>
    <text x="20" y="62" fill="#e1e8ed" font-family="Arial" font-size="13" font-weight="700">Observe → improve</text>

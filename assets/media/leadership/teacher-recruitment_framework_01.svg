    <text x="20" y="62" fill="#eaf5df" font-family="Arial" font-size="13" font-weight="700">Offer + role alignment</text>
    <text x="20" y="85" fill="#9fb68b" font-family="Arial" font-size="11">scope · reporting · standards</text>
    <text x="20" y="103" fill="#9fb68b" font-family="Arial" font-size="11">probation expectations</text>

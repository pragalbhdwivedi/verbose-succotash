  <path d="M165 412V376H165V346" fill="none" stroke="#72b8ff" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="64" y="593" fill="#71808b" font-family="Arial" font-size="11">Source basis: institutional recruitment/JD framework with role-specific competencies, selection stages and performance expectations.</text>
  <text x="64" y="626" fill="#71808b" font-family="ui-monospace, monospace" font-size="10">Privacy-safe derivative · no candidate, employee or compensation data shown</text>
  <text x="1136" y="626" text-anchor="end" fill="#72b8ff" font-family="ui-monospace, monospace" font-size="10">PRAGALBH.IN / LEADERSHIP EVIDENCE</text>

    <text x="20" y="62" fill="#e1e8ed" font-family="Arial" font-size="13" font-weight="700">Scope + qualification</text>
    <text x="20" y="85" fill="#9facb5" font-family="Arial" font-size="11">responsibilities · reporting</text>
    <text x="20" y="103" fill="#9facb5" font-family="Arial" font-size="11">competencies · expectations</text>
  </g>
  <path d="M260 283H315" stroke="#728392" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(325 220)">

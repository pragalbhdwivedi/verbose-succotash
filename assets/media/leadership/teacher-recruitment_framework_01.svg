<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Teacher recruitment and evaluation framework</title>
  <desc id="desc">Privacy-safe institutional process diagram showing role definition, screening, written or leadership evaluation, demo interaction, structured interview, selection, probation and performance review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07090c"/><stop offset="1" stop-color="#0b1219"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1a2630" stroke-width="1" opacity=".4"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#728392"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/>
  <text x="64" y="72" fill="#72b8ff" font-family="ui-monospace, monospace" font-size="15" letter-spacing="3">SOURCE-BACKED · INSTITUTIONAL LEADERSHIP</text>
  <text x="64" y="116" fill="#f2f5f7" font-family="Arial" font-size="34" font-weight="700">Teacher Recruitment &amp; Evaluation Framework</text>
  <text x="64" y="149" fill="#91a0ab" font-family="Arial" font-size="16">Role requirements translated into a structured selection and performance-expectation workflow</text>


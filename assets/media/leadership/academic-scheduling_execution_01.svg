<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Academic scheduling and school-wide execution</title><desc id="desc">Privacy-safe scheduling workflow showing requirements and constraints, FET data model, generated timetable, operational views, staff allocation publication, verification and discrepancy loop, daily execution, and downstream automation.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07090c"/><stop offset="1" stop-color="#0a1516"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#173034" stroke-width="1" opacity=".38"/></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6d8d91"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/><text x="64" y="72" fill="#68dfd0" font-family="ui-monospace,monospace" font-size="15" letter-spacing="3">PUBLIC REPOSITORY + SOURCE-BACKED OPERATIONS</text><text x="64" y="116" fill="#f2f5f7" font-family="Arial" font-size="34" font-weight="700">Academic Scheduling &amp; School-Wide Execution</text><text x="64" y="149" fill="#91a0ab" font-family="Arial" font-size="16">A timetable becomes an operational source when data, publication, verification and downstream use stay connected</text><g font-family="Arial"><g transform="translate(70 220)"><rect width="180" height="118" rx="14" fill="#0d191b" stroke="#72b8ff"/><text x="18" y="31" fill="#72b8ff" font-family="ui-monospace,monospace" font-size="11">01 · REQUIREMENTS</text><text x="18" y="60" fill="#e1e8ed" font-size="13" font-weight="700">Classes + subjects</text><text x="18" y="84" fill="#9facb5" font-size="11">teachers · rooms · constraints</text><text x="18" y="102" fill="#9facb5" font-size="11">academic operating rules</tex
" font-weight="700">Staff allocation check</text><text x="18" y="84" fill="#9fb68b" font-size="11">subject / class summary</text><text x="18" y="102" fill="#9fb68b" font-size="11">discrepancy → Principal</text></g><path d="M790 463H740" stroke="#6d8d91" stroke-width="2" marker-end="url(#a)"/><g transform="translate(550 404)"><rect width="180" height="118" rx="14" fill="#0d191b" stroke="#72b8ff"/><text x="18" y="31" fill="#72b8ff" font-family="ui-monospace,monospace" font-size="11">06 · EXECUTE</text><text x="18" y="60" fill="#e1e8ed" font-size="13" font-weight="700">Daily academic use</text><text x="18" y="84" fill="#9facb5" font-size="11">class · teacher · room</text><text x="18" y="102" fill="#9facb5" font-size="11">period / duty alignment</text></g><path d="M550 463H500" stroke="#6d8d91" stroke-width="2" marker-end="url(#a)"/><g transform="translate(310 404)"><rect width="180" height="118" rx="14" fill="#0d191b" stroke="#93a5b7"/><text x="18" y="31" fill="#b5c0ca" font-family="ui-monospace,monospace" font-size="11">07 · REUSE DATA</text><text x="18" y="60" fill="#e1e8ed" font-size="13" font-weight="700">Operational integrations</text><text x="18" y="84" fill="#9facb5" font-size="11">web publishing · reports</text><text x="18" y="102" fill="#9facb5" font-size="11">future room automation</text></g><path d="M310 463H260" stroke="#6d8d91" stroke-width="2" marker-end="url(#a)"/><g transform="translate(70 404)"><rect width="180" height="118" rx="14" fill="#0d191b" stroke="#68dfd0"/><text x="18" y="31" fill="#68dfd0" font-family="ui-monospace,monospace" font-size="11">08 · REVISE</text><text x="18" y="60" fill="#ddf1ee" font-size="13" font-weight="700">Constraint / allocation loop</text><text x="18" y="84" fill="#96b6b1" font-size="11">change source → regenerate</text><text x="18" y="102" fill="#96b6b1" font-size="11">avoid silent divergence</text></g></g><path d="M160 404V370H160V338" fill="none" stroke="#68dfd0" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="64" y="590" fill="#71808b" font-family="Arial" font-size="11">Evidence basis: public tt-bds FET outputs + source-backed staff timetable circular and verification instruction.</text><text x="64" y="624" fill="#71808b" font-family="ui-monospace,monospace" font-size="10">Privacy-safe derivative · teacher identities and protected operational details omitted</text><text x="1136" y="624" text-anchor="end" fill="#68dfd0" font-family="ui-monospace,monospace" font-size="10">PRAGALBH.IN / SCHEDULING EVIDENCE</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Compliance and documentation workflow</title><desc id="desc">Privacy-safe institutional workflow showing requirement intake, source verification, fixed and changing data separation, evidence checklist, record registers, annexure packaging, sign-off, submission and audit trail.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07090c"/><stop offset="1" stop-color="#11120d"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2a2818" stroke-width="1" opacity=".35"/></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8e876b"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/><text x="64" y="72" fill="#ffbd66" font-family="ui-monospace,monospace" font-size="15" letter-spacing="3">SOURCE-BACKED · COMPLIANCE SYSTEM</text><text x="64" y="116" fill="#f2f5f7" font-family="Arial" font-size="34" font-weight="700">Compliance &amp; Documentation Workflow</text><text x="64" y="149" fill="#9f9a84" font-family="Arial" font-size="16">Claims are verified against records, packaged with evidence and left auditable after submission</text>
<g font-family="Arial"><g transform="translate(70 220)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#ffbd66"/><text x="18" y="31" fill="#ffbd66" font-family="ui-monospace,monospace" font-size="11">01 · REQUIREMENT</text><text x="18" y="60" fill="#f2e5d2" font-size="13" font-weight="700">Portal / notice / query</text><text x="18" y="84" fill="#b8aa8e" font-size="11">field-by-field obligation</text><text x="18" y="102" fill="#b8aa8e" font-size="11">scope · deadline · owner</text></g><path d="M250 279H300" stroke="#8e876b" stroke-width="2" marker-end="url(#a)"/><g transform="translate(310 220)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#72b8ff"/><text x="18" y="31" fill="#72b8ff" font-family="ui-monospace,monospace" font-size="11">02 · VERIFY</text><text x="18" y="60" fill="#e1e8ed" font-size="13" font-weight="700">Official source check</text><text x="18" y="84" fill="#9facb5" font-size="11">recognition · orders · registers</text><text x="18" y="102" fill="#9facb5" font-size="11">do not infer unsupported facts</text></g><path d="M490 279H540" stroke="#8e876b" stroke-width="2" marker-end="url(#a)"/><g transform="translate(550 220)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#b896ff"/><text x="18" y="31" fill="#b896ff" font-family="ui-monospace,monospace" font-size="11">03 · CLASSIFY</text><text x="18" y="60" fill="#e8e1f3" font-size="13" font-weight="700">Fixed vs changing data</text><text x="18" y="84" fill="#aaa0b8" font-size="11">identity / recognition</text><text x="18" y="102" fill="#aaa0b8" font-size="11">monthly / session records</text></g><path d="M730 279H780" stroke="#8e876b" stroke-width="2" marker-end="url(#a)"/><g transform="translate(790 220)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#68dfd0"/><text x="18" y="31" fill="#68dfd0" font-family="ui-monospace,monospace" font-size="11">04 · EVIDENCE</text><text x="18" y="60" fill="#ddf1ee" font-size="13" font-weight="700">Checklist + proof gate</text><text x="18" y="84" fill="#96b6b1" font-size="11">claim only what exists</text><text x="18" y="102" fill="#96b6b1" font-size="11">orders · minutes · screenshots</text></g><path d="M880 338V394" stroke="#8e876b" stroke-width="2" marker-end="url(#a)"/><g transform="translate(790 404)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#93a5b7"/><text x="18" y="31" fill="#b5c0ca" font-family="ui-monospace,monospace" font-size="11">05 · REGISTER</text><text x="18" y="60" fill="#e1e8ed" font-size="13" font-weight="700">Structured records</text><text x="18" y="84" fill="#9facb5" font-size="11">fees · staff · books · accounts</text><text x="18" y="102" fill="#9facb5" font-size="11">publication · correspondence</text></g><path d="M790 463H740" stroke="#8e876b" stroke-width="2" marker-end="url(#a)"/><g transform="translate(550 404)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#ffbd66"/><text x="18" y="31" fill="#ffbd66" font-family="ui-monospace,monospace" font-size="11">06 · PACKAGE</text><text x="18" y="60" fill="#f2e5d2" font-size="13" font-weight="700">Annexure + index</text><text x="18" y="84" fill="#b8aa8e" font-size="11">status · reference · attachment</text><text x="18" y="102" fill="#b8aa8e" font-size="11">blank fields made explicit</text></g><path d="M550 463H500" stroke="#8e876b" stroke-width="2" marker-end="url(#a)"/><g transform="translate(310 404)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#baff67"/><text x="18" y="31" fill="#baff67" font-family="ui-monospace,monospace" font-size="11">07 · SIGN-OFF</text><text x="18" y="60" fill="#eaf5df" font-size="13" font-weight="700">Verify → certify → submit</text><text x="18" y="84" fill="#9fb68b" font-size="11">responsibility retained</text><text x="18" y="102" fill="#9fb68b" font-size="11">deadline + submission proof</text></g><path d="M310 463H260" stroke="#8e876b" stroke-width="2" marker-end="url(#a)"/><g transform="translate(70 404)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#72b8ff"/><text x="18" y="31" fill="#72b8ff" font-family="ui-monospace,monospace" font-size="11">08 · AUDIT TRAIL</text><text x="18" y="60" fill="#e1e8ed" font-size="13" font-weight="700">Retain source + evidence</text><text x="18" y="84" fill="#9facb5" font-size="11">what changed · who verified</text><text x="18" y="102" fill="#9facb5" font-size="11">ready for re-check / inspection</text></g></g><path d="M160 404V370H160V338" fill="none" stroke="#ffbd66" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="64" y="590" fill="#777461" font-family="Arial" font-size="11">Source basis: university portal pre-fill/compliance guide and structured A–K record-collection workbook for fee-regulation documentation.</text><text x="64" y="624" fill="#777461" font-family="ui-monospace,monospace" font-size="10">Privacy-safe derivative · no personal records, protected counts or raw compliance submissions shown</text><text x="1136" y="624" text-anchor="end" fill="#ffbd66" font-family="ui-monospace,monospace" font-size="10">PRAGALBH.IN / COMPLIANCE EVIDENCE</text></svg>
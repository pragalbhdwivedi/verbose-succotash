<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Admissions and institutional communication operations</title><desc id="desc">Privacy-safe communication workflow showing verified source facts, audience and purpose, message structure, channel and call to action, response capture, record or eligibility verification, follow-up, and review.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07090c"/><stop offset="1" stop-color="#11100d"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2d291c" stroke-width="1" opacity=".36"/></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8e876b"/></marker></defs><rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/><text x="64" y="72" fill="#ffbd66" font-family="ui-monospace,monospace" font-size="15" letter-spacing="3">SOURCE-BACKED · INSTITUTIONAL COMMUNICATION</text><text x="64" y="116" fill="#f2f5f7" font-family="Arial" font-size="34" font-weight="700">Admissions &amp; Institutional Communication Operations</text><text x="64" y="149" fill="#9f9a84" font-family="Arial" font-size="16">Verified facts become audience-specific information, a response path and a recordable next action</text><g font-family="Arial"><g transform="translate(70 220)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#72b8ff"/><text x="18" y="31" fill="#72b8ff" font-family="ui-monospace,monospace" font-size="11">01 · VERIFY FACTS</text><text x="18" y="60" fill="#e1e8ed" font-size="13" font-weight="700">Programme / directive</text><text x="18" y="84" fill="#9facb5" font-size="11">eligibility · approval · date</text><text x="18" y="102" fill="#9facb5" font-size="11">official criteria / records</text></g><path d="M250 279H300" stroke="#8e876b" stroke-width="2" marker-end="url(#a)"/><g transform="translate(310 220)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#b896ff"/><text x="18" y="31" fill="#b896ff" font-family="ui-monospace,monospace" font-size="11">02 · AUDIENCE</text><text x="18" y="60" fill="#e8e1f3" font-size="13" font-weight="700">Who needs what?</text><text x="18" y="84" fill="#aaa0b8" font-size="11">applicant · parent · staff</text><text x="18" y="102" fill="#aaa0b8" font-size="11">language · urgency · context</text></g><path d="M490 279H540" stroke="#8e876b" stroke-width="2" marker-end="url(#a)"/><g transform="translate(550 220)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#68dfd0"/><text x="18" y="31" fill="#68dfd0" font-family="ui-monospace,monospace" font-size="11">03 · MESSAGE</text><text x="18" y="60" fill="#ddf1ee" font-size="13" font-weight="700">Clear information</text><text x="18" y="84" fill="#96b6b1" font-size="11">what · who · when · how</text><text x="18" y="102" fill="#96b6b1" font-size="11">bilingual where needed</text></g><path d="M730 279H780" stroke="#8e876b" stroke-width="2" marker-end="url(#a)"/><g transform="translate(790 220)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#ffbd66"/><text x="18" y="31" fill="#ffbd66" font-family="ui-monospace,monospace" font-size="11">04 · RESPONSE PATH</text><text x="18" y="60" fill="#f2e5d2" font-size="13" font-weight="700">CTA / form / contact</text><text x="18" y="84" fill="#b8aa8e" font-size="11">call · WhatsApp · consent</text><text x="18" y="102" fill="#b8aa8e" font-size="11">application / return route</text></g><path d="M880 338V394" stroke="#8e876b" stroke-width="2" marker-end="url(#a)"/><g transform="translate(790 404)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#baff67"/><text x="18" y="31" fill="#baff67" font-family="ui-monospace,monospace" font-size="11">05 · CAPTURE</text><text x="18" y="60" fill="#eaf5df" font-size="13" font-weight="700">Record the response</text><text x="18" y="84" fill="#9fb68b" font-size="11">contact · consent · details</text><text x="18" y="102" fill="#9fb68b" font-size="11">only data actually needed</text></g><path d="M790 463H740" stroke="#8e876b" stroke-width="2" marker-end="url(#a)"/><g transform="translate(550 404)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#72b8ff"/><text x="18" y="31" fill="#72b8ff" font-family="ui-monospace,monospace" font-size="11">06 · VALIDATE</text><text x="18" y="60" fill="#e1e8ed" font-size="13" font-weight="700">Eligibility / record check</text><text x="18" y="84" fill="#9facb5" font-size="11">official criteria · school data</text><text x="18" y="102" fill="#9facb5" font-size="11">avoid unsupported promises</text></g><path d="M550 463H500" stroke="#8e876b" stroke-width="2" marker-end="url(#a)"/><g transform="translate(310 404)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#93a5b7"/><text x="18" y="31" fill="#b5c0ca" font-family="ui-monospace,monospace" font-size="11">07 · FOLLOW-UP</text><text x="18" y="60" fill="#e1e8ed" font-size="13" font-weight="700">Next action</text><text x="18" y="84" fill="#9facb5" font-size="11">documents · counselling</text><text x="18" y="102" fill="#9facb5" font-size="11">coordination / clarification</text></g><path d="M310 463H260" stroke="#8e876b" stroke-width="2" marker-end="url(#a)"/><g transform="translate(70 404)"><rect width="180" height="118" rx="14" fill="#17170f" stroke="#b896ff"/><text x="18" y="31" fill="#b896ff" font-family="ui-monospace,monospace" font-size="11">08 · REVIEW</text><text x="18" y="60" fill="#e8e1f3" font-size="13" font-weight="700">Accuracy + clarity</text><text x="18" y="84" fill="#aaa0b8" font-size="11">update source information</text><text x="18" y="102" fill="#aaa0b8" font-size="11">improve future communication</text></g></g><path d="M160 404V370H160V338" fill="none" stroke="#ffbd66" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="64" y="590" fill="#777461" font-family="Arial" font-size="11">Evidence basis: admission campaign requirements + bilingual parent communication/consent workflow. Graphic design is not claimed as Pragalbh’s work.</text><text x="64" y="624" fill="#777461" font-family="ui-monospace,monospace" font-size="10">Privacy-safe derivative · no applicant, parent or student personal data shown</text><text x="1136" y="624" text-anchor="end" fill="#ffbd66" font-family="ui-monospace,monospace" font-size="10">PRAGALBH.IN / COMMUNICATION EVIDENCE</text></svg>
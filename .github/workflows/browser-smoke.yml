name: Browser smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/browser-smoke.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static portfolio server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          echo $! > /tmp/portfolio-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-http.log
          exit 1

      - name: Run rendered browser smoke test
        run: npm run smoke:browser
        env:
          PORTFOLIO_TEST_URL: http://127.0.0.1:4173/

      - name: Run electrical motion smoke test
        run: node tests/electrical-motion-smoke.mjs
        env:
          PORTFOLIO_TEST_URL: http://127.0.0.1:4173/

      - name: Run Impeccable visual hierarchy smoke test
        run: node tests/impeccable-visual-smoke.mjs
        env:
          PORTFOLIO_TEST_URL: http://127.0.0.1:4173/

      - name: Run typography smoke test
        run: node tests/typography-smoke.mjs
        env:
          PORTFOLIO_TEST_URL: http://127.0.0.1:4173/

      - name: Run motion choreography smoke test
        run: node tests/motion-choreography-smoke.mjs
        env:
          PORTFOLIO_TEST_URL: http://127.0.0.1:4173/

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failure
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/portfolio-http.log || true
